          path: |
            out/m05/*.xml
            out/m05/**/result.json
            out/m05/**/case.json
            out/m05/**/layout.json
            out/m05/**/*.log
            build/m05-Debug/*.json
            build/m05-Release/*.json
            build/m05-*/*.map
            build/m05-*/*.lst
            build/m05-*/*.log
            build/m05-*/native-host/host.log
