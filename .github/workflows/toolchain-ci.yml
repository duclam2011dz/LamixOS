name: Toolchain CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  toolchain:
    name: Build and verify freestanding sample
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      LAMIX_CROSS_ROOT: ${{ github.workspace }}/out/m01/cross
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Chuẩn bị Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Cài dependencies host
        timeout-minutes: 10
        run: |
          # Mirror Azure có thể tải rất chậm; vẫn dùng Ubuntu archive và apt signature checks.
          for source in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if test -f "$source"; then
              sudo sed -i -e 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' -e 's|https://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends build-essential bison flex libgmp-dev libmpfr-dev libmpc-dev texinfo xz-utils nasm cmake ninja-build python3-venv qemu-system-x86 gdb ovmf seabios dosfstools mtools clang lld clang-format clang-tidy cppcheck
          python3 -m venv .venv
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.lock
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Cache cross-toolchain chính xác
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.LAMIX_CROSS_ROOT }}
          key: cross-ubuntu22-gcc12-binutils239-${{ hashFiles('scripts/toolchain-lock.json', 'scripts/bootstrap_cross.py') }}
      - name: Bootstrap GNU cross-toolchain
        run: .venv/bin/python scripts/bootstrap_cross.py --prefix "$LAMIX_CROSS_ROOT" --jobs 4
      - name: Doctor
        run: .venv/bin/python scripts/doctor.py --profile ci --json out/m01/doctor.json
      - name: Build, CTest và kiểm chứng tái lập
        run: .venv/bin/python scripts/smoke.py --reproducible
      - name: M03 cross compile-only, không target execution
        run: .venv/bin/python scripts/check_boot_cross.py
      - name: M05 BIOS Stage2, ELF64 và LBP guest probe
        timeout-minutes: 10
        run: |
          for mode in Debug Release; do
            cmake -S tests/bios_stage2 -B "build/m05-$mode" -G Ninja -DCMAKE_BUILD_TYPE="$mode" -DPython3_EXECUTABLE="$GITHUB_WORKSPACE/.venv/bin/python"
            cmake --build "build/m05-$mode"
            ctest --test-dir "build/m05-$mode" --no-tests=error --output-on-failure --output-junit "$GITHUB_WORKSPACE/out/m05/ctest-$mode.xml"
          done
      - name: M06 PE/COFF và guest UEFI OVMF thật
        timeout-minutes: 10
        run: |
          cmake -S tests/uefi -B build/m06-tests -G Ninja -DPython3_EXECUTABLE="$GITHUB_WORKSPACE/.venv/bin/python"
          cmake --build build/m06-tests
          ctest --test-dir build/m06-tests --no-tests=error --output-on-failure --output-junit "$GITHUB_WORKSPACE/out/m06/ctest.xml"
      - name: Build artifact chung M05 cho image/parity M07
        run: python3 tests/bios_stage2/build_stage2.py --build build/m07-input --profile Debug
      - name: M07 tạo image và boot cùng image qua SeaBIOS/OVMF
        timeout-minutes: 15
        run: |
          cmake -S tests/m07 -B build/m07-tests -G Ninja -DPython3_EXECUTABLE="$GITHUB_WORKSPACE/.venv/bin/python"
          ctest --test-dir build/m07-tests --no-tests=error --output-on-failure --output-junit "$GITHUB_WORKSPACE/out/m07/ctest.xml"
      - name: M08 kernel ELF, serial panic/exception và PIC/PIT qua BIOS/UEFI
        timeout-minutes: 15
        run: |
          cmake -S tests/m08 -B build/m08-tests -G Ninja -DPython3_EXECUTABLE="$GITHUB_WORKSPACE/.venv/bin/python"
          ctest --test-dir build/m08-tests --no-tests=error --output-on-failure --output-junit "$GITHUB_WORKSPACE/out/m08/ctest.xml"
      - name: M09 Bitmap PMM, sanitizer và guest BIOS/UEFI
        timeout-minutes: 15
        run: |
          cmake -S tests/m09 -B build/m09-tests -G Ninja -DPython3_EXECUTABLE="$GITHUB_WORKSPACE/.venv/bin/python"
          cmake --build build/m09-tests
          ctest --test-dir build/m09-tests --no-tests=error --output-on-failure --output-junit "$GITHUB_WORKSPACE/out/m09/ctest.xml"
      - name: M10 VMM, sanitizer, BIOS/UEFI và fault protection guest
        timeout-minutes: 20
        run: |
          cmake -S tests/m10 -B build/m10-tests -G Ninja -DPython3_EXECUTABLE="$GITHUB_WORKSPACE/.venv/bin/python"
          cmake --build build/m10-tests
          ctest --test-dir build/m10-tests --no-tests=error --output-on-failure --output-junit "$GITHUB_WORKSPACE/out/m10/ctest.xml"
      - name: M11 kernel heap, C++ freestanding và guest BIOS/UEFI
        timeout-minutes: 20
        run: |
          cmake -S tests/m11 -B build/m11-tests -G Ninja -DPython3_EXECUTABLE="$GITHUB_WORKSPACE/.venv/bin/python"
          cmake --build build/m11-tests
          ctest --test-dir build/m11-tests --no-tests=error --output-on-failure --output-junit "$GITHUB_WORKSPACE/out/m11/ctest.xml"
      - name: M12 Buddy PMM, sanitizer, benchmark host và guest BIOS/UEFI
        timeout-minutes: 25
        run: |
          cmake -S tests/m12 -B build/m12-tests -G Ninja -DPython3_EXECUTABLE="$GITHUB_WORKSPACE/.venv/bin/python"
          cmake --build build/m12-tests
          ctest --test-dir build/m12-tests --no-tests=error --output-on-failure --output-junit "$GITHUB_WORKSPACE/out/m12/ctest.xml"
      - name: M13 ACPI, PCI, device registry và guest BIOS/UEFI
        timeout-minutes: 20
        run: |
          cmake -S tests/m13 -B build/m13-tests -G Ninja -DPython3_EXECUTABLE="$GITHUB_WORKSPACE/.venv/bin/python"
          cmake --build build/m13-tests
          ctest --test-dir build/m13-tests --no-tests=error --output-on-failure --output-junit "$GITHUB_WORKSPACE/out/m13/ctest.xml"
      - name: M14 ACPI handoff, APIC/IOAPIC và LAPIC timer
        timeout-minutes: 35
        run: |
          cmake -S tests/m14 -B build/m14-tests -G Ninja -DPython3_EXECUTABLE="$GITHUB_WORKSPACE/.venv/bin/python"
          cmake --build build/m14-tests
          ctest --test-dir build/m14-tests --no-tests=error --output-on-failure --output-junit "$GITHUB_WORKSPACE/out/m14/ctest.xml"
      - name: M15 input PS/2, sanitizer và guest BIOS/UEFI
        timeout-minutes: 40
        run: |
          cmake -S tests/m15 -B build/m15-tests -G Ninja -DPython3_EXECUTABLE="$GITHUB_WORKSPACE/.venv/bin/python"
          cmake --build build/m15-tests
          ctest --test-dir build/m15-tests --no-tests=error --output-on-failure --output-junit "$GITHUB_WORKSPACE/out/m15/ctest.xml"
      - name: M16 software framebuffer renderer và guest BIOS/UEFI
        timeout-minutes: 40
        run: |
          cmake -S tests/m16 -B build/m16-tests -G Ninja -DPython3_EXECUTABLE="$GITHUB_WORKSPACE/.venv/bin/python"
          cmake --build build/m16-tests
          ctest --test-dir build/m16-tests --no-tests=error --output-on-failure --output-junit "$GITHUB_WORKSPACE/out/m16/ctest.xml"
      - name: M17 VirtIO-GPU 2D, fallback và guest screenshot BIOS/UEFI
        timeout-minutes: 45
        run: |
          cmake -S tests/m17 -B build/m17-tests -G Ninja -DPython3_EXECUTABLE="$GITHUB_WORKSPACE/.venv/bin/python"
          cmake --build build/m17-tests
          ctest --test-dir build/m17-tests --no-tests=error --output-on-failure --output-junit "$GITHUB_WORKSPACE/out/m17/ctest.xml"
      - name: M19 BSP scheduler sanitizer và guest BIOS/UEFI
        timeout-minutes: 45
        run: |
          cmake -S tests/m19 -B build/m19-tests -G Ninja -DPython3_EXECUTABLE="$GITHUB_WORKSPACE/.venv/bin/python"
          cmake --build build/m19-tests
          ctest --test-dir build/m19-tests --no-tests=error --output-on-failure --output-junit "$GITHUB_WORKSPACE/out/m19/ctest.xml"
      - name: M20 ring 3, process isolation và guest BIOS/UEFI
        timeout-minutes: 60
        run: |
          cmake -S tests/m20 -B build/m20-tests -G Ninja -DPython3_EXECUTABLE="$GITHUB_WORKSPACE/.venv/bin/python"
          cmake --build build/m20-tests
          ctest --test-dir build/m20-tests --no-tests=error --output-on-failure --output-junit "$GITHUB_WORKSPACE/out/m20/ctest.xml"
      - name: M21 syscall ABI v1 sanitizer và guest ring 3 BIOS/UEFI
        timeout-minutes: 60
