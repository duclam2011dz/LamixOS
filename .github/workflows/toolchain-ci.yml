          ctest --test-dir build/m24-tests --no-tests=error --output-on-failure --output-junit "$GITHUB_WORKSPACE/out/m24/ctest.xml"
      - name: Kiểm tra tài liệu
        run: python3 scripts/validate_docs.py
      - name: Lưu M03 cross evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m03-cross-reports
          path: |
            out/m03/cross.json
            out/m03/cross.log
          if-no-files-found: warn
      - name: Lưu logs khi thất bại
        if: failure()
