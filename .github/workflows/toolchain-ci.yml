          name: m01-failure-logs
          path: |
            out/m01/*.json
            out/m01/*.log
            out/m01/bootstrap/bootstrap.log
            build/*/Testing/Temporary/LastTest.log
          if-no-files-found: warn
      - name: Lưu M05 target/guest evidence, không upload images/firmware
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
