      - name: M24 SMP AP startup, per-CPU scheduler và guest topology
        timeout-minutes: 90
        run: |
          cmake -S tests/m24 -B build/m24-tests -G Ninja -DPython3_EXECUTABLE="$GITHUB_WORKSPACE/.venv/bin/python"
