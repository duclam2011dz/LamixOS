name: Harness CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness:
    name: Verify harness, paused launch and BIOS Stage1
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Chuẩn bị Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Cài dependencies host, không build cross-compiler
        timeout-minutes: 5
        run: |
          for source in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if test -f "$source"; then
              sudo sed -i -e 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' -e 's|https://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends qemu-system-x86 ovmf seabios nasm cmake ninja-build python3-venv
          python3 -m venv .venv
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.lock
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Cấu hình CTest host-only
        run: cmake -S tests/qemu -B build/m02 -DPython3_EXECUTABLE="$GITHUB_WORKSPACE/.venv/bin/python"
      - name: Fixture, emulator launch thật và boot skeleton
        run: ctest --test-dir build/m02 --no-tests=error --output-on-failure --output-junit "$GITHUB_WORKSPACE/out/m02/ctest.xml"
      - name: BIOS Stage1 thực thi thật, không phải OS boot
        timeout-minutes: 5
        run: |
          cmake -S tests/bios -B build/m04 -G Ninja -DPython3_EXECUTABLE="$GITHUB_WORKSPACE/.venv/bin/python"
          cmake --build build/m04
          ctest --test-dir build/m04 --no-tests=error --output-on-failure --output-junit "$GITHUB_WORKSPACE/out/m04/ctest.xml"
      - name: Kiểm tra tài liệu
        run: python3 scripts/validate_docs.py
      - name: Ghi summary đúng phạm vi
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('### Harness M02\n\nLaunch-only không chứng minh OS boot.\n\n')
              report = Path('out/m02/ctest.xml')
              if not report.exists():
                  summary.write('NOT RUN: chưa có CTest report; xem lỗi job.\n')
              else:
                  for case in ET.parse(report).getroot().iter('testcase'):
                      status = 'SKIPPED' if case.find('skipped') is not None else 'FAIL' if case.find('failure') is not None or case.find('error') is not None else 'PASS'
                      summary.write(f"- {case.attrib['name']}: {status}\n")
              summary.write('\n### BIOS Stage1 M04\n\nNegative cases đạt khi nhận guest failure dự kiến; không phải OS boot.\n\n')
              m04 = Path('out/m04/ctest.xml')
              if not m04.exists():
                  summary.write('NOT RUN: chưa có M04 report.\n')
              else:
                  for case in ET.parse(m04).getroot().iter('testcase'):
                      status = 'FAIL' if case.find('failure') is not None or case.find('error') is not None else 'SKIPPED' if case.find('skipped') is not None else 'PASS'
                      summary.write(f"- {case.attrib['name']}: {status}\n")
          PY
      - name: Lưu JUnit và kết quả phân loại
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m02-reports
          path: |
            out/m02/*.xml
            out/m02/**/result.json
          if-no-files-found: warn
      - name: Lưu logs khi thất bại, không upload firmware
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m02-failure-logs
          path: |
            out/m02/**/*.log
            build/m02/Testing/Temporary/*.log
          if-no-files-found: warn
      - name: Lưu bằng chứng Stage1, không upload image hoặc firmware
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m04-reports
          path: |
            out/m04/*.xml
            out/m04/*.json
            out/m04/**/result.json
            out/m04/**/case.json
            out/m04/**/*.log
            build/m04/stage1.lst
            build/m04/Testing/Temporary/*.log
          if-no-files-found: warn
