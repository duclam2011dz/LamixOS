name: Boot Contract CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Chuẩn bị Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Dependencies host đã ghim, không bootstrap compiler
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.lock
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Host Debug và Release
        run: |
          for mode in Debug Release; do
            cmake -S tests/boot -B "build/m03-$mode" -G Ninja -DCMAKE_BUILD_TYPE="$mode" -DPython3_EXECUTABLE="$GITHUB_WORKSPACE/.venv/bin/python"
            cmake --build "build/m03-$mode"
            ctest --test-dir "build/m03-$mode" --no-tests=error --output-on-failure --output-junit "$GITHUB_WORKSPACE/out/m03/ctest-$mode.xml"
          done
          build/m03-Debug/layout-report > out/m03/layout.json
      - name: ASan và UBSan native mutations
        run: |
          cmake -S tests/boot -B build/m03-sanitize -G Ninja -DCMAKE_BUILD_TYPE=Debug -DLAMIX_SANITIZERS=ON -DPython3_EXECUTABLE="$GITHUB_WORKSPACE/.venv/bin/python"
          cmake --build build/m03-sanitize
          ctest --test-dir build/m03-sanitize --no-tests=error --output-on-failure --output-junit "$GITHUB_WORKSPACE/out/m03/ctest-sanitize.xml"
      - name: M05 host parsers Debug/Release và sanitizers
        run: |
          for mode in Debug Release; do
            cmake -S tests/bios_stage2 -B "build/m05-host-$mode" -G Ninja -DLAMIX_STAGE2_HOST_ONLY=ON -DCMAKE_BUILD_TYPE="$mode" -DPython3_EXECUTABLE="$GITHUB_WORKSPACE/.venv/bin/python"
            ctest --test-dir "build/m05-host-$mode" --no-tests=error --output-on-failure --output-junit "$GITHUB_WORKSPACE/out/m05/host-ctest-$mode.xml"
          done
          cmake -S tests/bios_stage2 -B build/m05-sanitize -G Ninja -DLAMIX_STAGE2_HOST_ONLY=ON -DLAMIX_SANITIZERS=ON -DCMAKE_BUILD_TYPE=Debug -DPython3_EXECUTABLE="$GITHUB_WORKSPACE/.venv/bin/python"
          ctest --test-dir build/m05-sanitize --no-tests=error --output-on-failure --output-junit "$GITHUB_WORKSPACE/out/m05/host-ctest-sanitize.xml"
      - name: Kiểm tra tài liệu
        run: |
          python3 scripts/validate_docs.py
          python3 -m unittest discover -s tests -p 'test_validate_docs.py'
      - name: Lưu reports và logs, không upload fixture binaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m03-reports
          path: |
            out/m03/*.xml
            out/m03/*.json
            build/m03-*/Testing/Temporary/*.log
          if-no-files-found: warn
      - name: Lưu M05 host evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m05-host-reports
          path: |
            out/m05/host*.xml
            build/m05-host-*/native-host/host.log
            build/m05-sanitize/native-host/host.log
          if-no-files-found: warn
