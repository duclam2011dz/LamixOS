name: Documentation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-docs:
    name: Validate documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Chuẩn bị Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Kiểm thử validator
        run: python3 -m unittest discover -s tests -p 'test_validate_docs.py'
      - name: Kiểm tra tài liệu repository
        run: python3 scripts/validate_docs.py
